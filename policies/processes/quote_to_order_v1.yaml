process_key: quote_to_order
version: 1.0.0
name: Quote-to-Order baseline
objects:
  - name: customer
    external_types: [res.partner]
  - name: product
    external_types: [product.product]
  - name: quotation
    external_types: [sale.order]
  - name: sales_order
    external_types: [sale.order]
events:
  - name: sales.quote.created
    object: quotation
  - name: sales.quote.reviewed
    object: quotation
  - name: sales.order.created
    object: sales_order
  - name: sales.order.confirmed
    object: sales_order
decisions:
  - name: formula_guard
    applies_to: sales.quote.reviewed
    outcomes: [allow, block]
  - name: approval_gate
    applies_to: sales.order.confirmed
    outcomes: [approved, rejected]
metrics:
  - name: quote_to_order_duration
    kind: duration
    start_event: sales.quote.created
    end_event: sales.order.created
  - name: formula_block_rate
    kind: ratio
    numerator: formula_guard.block
    denominator: sales.quote.reviewed
policies:
  - name: no_unapproved_confirmation
    decision: approval_gate
    blocking: true
fixtures:
  - name: happy_path
    events: [sales.quote.created, sales.quote.reviewed, sales.order.created]
