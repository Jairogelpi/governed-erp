name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check erpguard apps tests migrations
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest
      - name: Alembic upgrade
        run: python -m alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker image build
        run: docker build --tag erpguard-evolution:ci .

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erpguard
          POSTGRES_PASSWORD: erpguard
          POSTGRES_DB: erpguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erpguard -d erpguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and migration tools
        run: python -m pip install -e ".[dev]"
      - name: Upgrade PostgreSQL baseline
        env:
          ERPGUARD_DATABASE_URL: postgresql+psycopg://erpguard:erpguard@localhost:5432/erpguard
        run: python -m alembic upgrade head
      - name: Downgrade and re-upgrade the latest migration against PostgreSQL
        env:
          ERPGUARD_DATABASE_URL: postgresql+psycopg://erpguard:erpguard@localhost:5432/erpguard
        run: |
          python -m alembic downgrade -1
          python -m alembic upgrade head
      - name: Test retired-schema migration against real PostgreSQL
        env:
          ERPGUARD_DATABASE_URL: postgresql+psycopg://erpguard:erpguard@localhost:5432/erpguard
        run: python -m pytest tests/test_phase2_migrations.py tests/test_c82_retired_schema_postgres.py -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
