name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check erpguard/version.py apps/api/main.py apps/api/routes/release.py erpguard/product/release_readiness.py tests/test_phase1_project_hygiene.py
      - name: Type check
        run: mypy
      - name: Tests
        run: python -m pytest
      - name: Docker image build
        run: docker build --tag erpguard-evolution:ci .
