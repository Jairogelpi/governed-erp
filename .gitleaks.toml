title = "ERPGuard gitleaks config"

[extend]
# Keep every default detection rule; only add an allowlist on top.
useDefault = true

[allowlist]
description = "ERPGuard's own generated resource IDs (prefix + uuid4().hex), not secrets -- these trip the default generic-api-key rule's entropy heuristic wherever they appear in demo/evidence docs (e.g. docs/demo/backend_rc_live_pricing_scenario_evidence.json). Also allowlists the one demo-only Fernet key committed in docker-compose.demo.yml (Spec 95) -- a placeholder for the local-only Docker Compose demo stack's at-rest secret vault, never reused for a real deployment, called out as such in the file's own comment; not a credential for anything reachable outside that container."
regexes = [
  '''(rec|actdraft|run|approval|canarypolicy|canaryroute|canaryincident|skillpkg|uconn|decisionoutcomeevidence|outcomeplan)_[0-9a-f]{32}''',
  '''RW16U6aabLIqnRVAXWGDhX6njui0SSl6p1yjZlAw_Qc=''',
]
