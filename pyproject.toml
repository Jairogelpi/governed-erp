[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "erpguard"
version = "0.14.0"
description = "Semantic safety layer for ERP operations."
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14",
    "cryptography>=43",
    "fastapi>=0.115",
    "pydantic-settings>=2.0",
    "PyYAML>=6.0",
    "playwright>=1.0",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.13,<2",
    "pytest>=8.0",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]
benchmark = [
    "anthropic>=0.40",
    "matplotlib>=3.9",
]

[project.entry-points."erpguard.connectors"]
fake = "erpguard.connectors.fake.plugin:FakeConnector"
odoo = "erpguard.connectors.odoo.plugin:OdooConnectorPlugin"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "erpguard.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["I001"]

[tool.mypy]
python_version = "3.11"
files = [
    "erpguard",
    "apps",
]
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Optional `erpguard[benchmark]` extras -- lazily imported only when the
# direct_tool_agent/plotting paths actually run; not installed in the
# default `[dev]` CI environment, so mypy must not require their stubs.
module = ["anthropic", "anthropic.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["apps*", "erpguard*"]
exclude = ["docs*", "policies*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
